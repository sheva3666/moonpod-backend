name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Unit-tested code imports generated Prisma types (e.g. Prisma.UserWhereInput),
      # so the client must exist even though no database is touched.
      - run: npx prisma generate

      - run: npm run test
